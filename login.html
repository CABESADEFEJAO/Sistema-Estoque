<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="utf-8" />
    <title>Login - Estoque</title>
    <link rel="stylesheet" href="style.css">
    <link href='https://cdn.boxicons.com/3.0.6/fonts/basic/boxicons.min.css' rel='stylesheet'>
</head>
<body>

    <div class="page-geral">

        <h1 class="page-title">Sistema de Controle de Estoque <i class='bx  bx-package'></i></h1>

        <div class="container">
            <div class="curved-shape"></div>
            <div class="curved-shape2"></div>

            <div class="form-box Login">
                <h2 class="animation" style="--D:0; --S:21">Login</h2>
                <form action="#">

                    <div class="input-box animation" style="--D:1; --S:22">
                        <input type="text" required>
                        <label for="">Usuário</label>
                        <i class='bx  bx-user'></i>
                    </div>

                    <div class="input-box animation" style="--D:2; --S:23">
                        <input type="text" required>
                        <label for="">Senha</label>
                        <i class='bx  bx-lock'></i>
                    </div>

                    <div class="input-box animation" style="--D:3; --S:24">
                        <button class="btn" type="submit">Entrar</button>
                    </div>

                    <div class="regi-link animation" style="--D:4; --S:25">
                        <p>Não tem uma conta? <a href="#" class="SignUpLink">Cadastre-se</a></p>
                    </div>

                </form>
            </div>

            <div class="info-content Login">
                <h2 class="animation" style="--D:0; --S:20">Bem-Vindo!</h2>
                <p class="animation" style="--D:1; --S:21">Faça o login para ver todos produtos cadastrados no estoque</p>
            </div>

            <div class="form-box Register">
                <h2 class="animation" style="--li:17; --S:0">Cadastrar</h2>
                <form action="#">

                    <div class="input-box animation" style="--li:18; --S:1">
                        <input type="text" required>
                        <label for="">Nome Completo</label>
                        <i class='bx  bx-user'></i>
                    </div>

                    <div class="input-box animation" style="--li:18; --S:1">
                        <input type="text" required>
                        <label for="">Usuário</label>
                        <i class='bx  bx-user'></i>
                    </div>

                    <div class="input-box animation" style="--li:19; --S:2">
                        <input type="text" required>
                        <label for="">Senha</label>
                        <i class='bx  bx-lock'></i>
                    </div>

                    <div class="input-box animation" style="--li:20; --S:3">
                        <button class="btn" type="submit">Cadastrar</button>
                    </div>

                    <div class="regi-link animation" style="--li:21; --S:4">
                        <p>Já tem uma conta? <a href="#" class="SignInLink">Entrar</a></p>
                    </div>

                </form>
            </div>

            <div class="info-content Register">
                <h2 class="animation" style="--li:17; --S:0">Vamos lá!</h2>
                <p class="animation" style="--li:18; --S:1">Cadastre seu usuário e senha para continuarmos...</p>
            </div>

        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
